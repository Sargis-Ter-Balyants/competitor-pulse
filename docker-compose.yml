services:
  mock-llm:
    image: node:24-alpine
    command: node /app/server.mjs
    volumes:
      - ./mock-llm/server.mjs:/app/server.mjs:ro

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      POLL_INTERVAL_MS: 15000
      LLM_BASE_URL: http://mock-llm:4001/v1
      LLM_API_KEY: mock
      LLM_MODEL: mock-llm
      LLM_TIMEOUT_MS: 10000
    volumes:
      - pulse-data:/data
    depends_on:
      - mock-llm

volumes:
  pulse-data:
